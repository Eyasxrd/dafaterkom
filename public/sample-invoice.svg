<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" style="background:#ffffff; font-family: 'Segoe UI', Arial, Tahoma, sans-serif;">
  <rect width="1000" height="1300" fill="#ffffff" />
  
  <!-- Header Border -->
