  <text x="80" y="155" font-size="15" fill="#64748b">Tax ID / الرقم الضريبي: 300123456700003</text>
  <text x="80" y="185" font-size="14" fill="#64748b">Phone: +966 50 123 4567 | Riyadh, Saudi Arabia</text>
  
  <!-- Invoice Title & Meta -->
  <text x="910" y="85" font-size="26" font-weight="900" fill="#1e40af" text-anchor="end">TAX INVOICE / فاتورة ضريبية</text>
  <text x="910" y="125" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">Invoice No: INV-2025-089</text>
  <text x="910" y="155" font-size="15" fill="#334155" text-anchor="end">Date / التاريخ: 2025-05-15</text>
  <text x="910" y="185" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="end">Due Date / الاستحقاق: 2025-06-15</text>

  <!-- Table Header -->
