  <text x="520" y="280" font-size="15" font-weight="bold" fill="#ffffff">Qty / الكمية</text>
  <text x="640" y="280" font-size="15" font-weight="bold" fill="#ffffff">Unit / الوحدة</text>
  <text x="760" y="280" font-size="15" font-weight="bold" fill="#ffffff">Price / السعر</text>
  <text x="920" y="280" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">Total / الإجمالي</text>

  <!-- Table Row 1 -->
  <rect x="50" y="295" width="900" height="55" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="70" y="330" font-size="15" fill="#64748b">1</text>
  <text x="120" y="330" font-size="16" font-weight="600" fill="#0f172a">Fresh Milk 1L / حليب طازج 1 لتر</text>
  <text x="520" y="330" font-size="16" font-weight="bold" fill="#0f172a">20</text>
  <text x="640" y="330" font-size="15" fill="#475569">pieces</text>
  <text x="760" y="330" font-size="16" fill="#0f172a">2.50</text>
  <text x="920" y="330" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">50.00</text>

  <!-- Table Row 2 -->
  <rect x="50" y="350" width="900" height="55" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="70" y="385" font-size="15" fill="#64748b">2</text>
  <text x="120" y="385" font-size="16" font-weight="600" fill="#0f172a">Mozzarella Cheese / جبنة موزاريلا</text>
  <text x="520" y="385" font-size="16" font-weight="bold" fill="#0f172a">10</text>
  <text x="640" y="385" font-size="15" fill="#475569">kg</text>
  <text x="760" y="385" font-size="16" fill="#0f172a">8.00</text>
  <text x="920" y="385" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">80.00</text>

  <!-- Table Row 3 -->
  <rect x="50" y="405" width="900" height="55" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
