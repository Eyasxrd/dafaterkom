  <text x="120" y="440" font-size="16" font-weight="600" fill="#0f172a">Tomato Sauce / صلصة طماطم</text>
  <text x="520" y="440" font-size="16" font-weight="bold" fill="#0f172a">5</text>
  <text x="640" y="440" font-size="15" fill="#475569">can</text>
  <text x="760" y="440" font-size="16" fill="#0f172a">12.00</text>
  <text x="920" y="440" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">60.00</text>

  <!-- Table Row 4 -->
  <rect x="50" y="460" width="900" height="55" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="70" y="495" font-size="15" fill="#64748b">4</text>
  <text x="120" y="495" font-size="16" font-weight="600" fill="#0f172a">Espresso Coffee Beans / حبوب بن اسبريسو</text>
  <text x="520" y="495" font-size="16" font-weight="bold" fill="#0f172a">4</text>
  <text x="640" y="495" font-size="15" fill="#475569">kg</text>
  <text x="760" y="495" font-size="16" fill="#0f172a">25.00</text>
  <text x="920" y="495" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">100.00</text>

  <!-- Totals Box -->
  <rect x="550" y="540" width="400" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  
  <text x="580" y="575" font-size="15" fill="#475569">Subtotal / المجموع الفرعي:</text>
  <text x="920" y="575" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">$290.00</text>

  <text x="580" y="615" font-size="15" fill="#475569">VAT (15%) / ضريبة القيمة المضافة:</text>
  <text x="920" y="615" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="end">$43.50</text>

  <line x1="570" y1="635" x2="930" y2="635" stroke="#cbd5e1" stroke-width="1" />

  <text x="580" y="675" font-size="17" font-weight="900" fill="#1e40af">Total Amount / المبلغ الإجمالي:</text>
  <text x="920" y="675" font-size="20" font-weight="900" fill="#1e40af" text-anchor="end">$333.50</text>

  <!-- Footer note & stamp -->
  <rect x="50" y="730" width="900" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="75" y="765" font-size="14" font-weight="bold" fill="#1e40af">Terms &amp; Payment:</text>
  <text x="75" y="792" font-size="13" fill="#3b82f6">Payment due within 30 days. Thank you for your business / نرجو السداد خلال 30 يوم من تاريخ الفاتورة.</text>
